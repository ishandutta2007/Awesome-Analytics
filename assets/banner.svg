<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient for Text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 56px;
      fill: url(#textGradient);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 1px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* Dynamic CSS Keyframe Animations */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes floatChart {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes waveMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }

    .pulsing-grid {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .animated-chart {
      animation: floatChart 4s ease-in-out infinite;
    }
    .animated-wave {
      stroke-dasharray: 20 10;
      animation: waveMove 30s linear infinite;
    }
  </style>

  <!-- Dark Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" />

  <!-- Background Animated Grid Elements -->
  <g class="pulsing-grid" opacity="0.15" stroke="#6366f1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1100" y1="0" x2="1100" y2="320" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
  </g>

  <!-- Dynamic Wave Background Graphic (Kept in Background behind text) -->
  <path class="animated-wave" d="M0,220 Q300,140 600,220 T1200,180" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" />
  <path class="animated-wave" d="M0,250 Q400,180 800,260 T1200,210" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.2" />

  <!-- Dynamic Floating Chart Graphic on Right Side -->
  <g class="animated-chart" transform="translate(850, 60)">
    <!-- Chart Background Board -->
    <rect x="0" y="0" width="280" height="200" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Area Chart Gradient -->
    <defs>
      <linearGradient id="chartAreaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
      </linearGradient>
    </defs>
    
    <!-- Chart Area Fill -->
    <path d="M 20,150 L 60,110 L 100,130 L 140,70 L 180,90 L 220,40 L 250,60 L 250,170 L 20,170 Z" fill="url(#chartAreaGrad)" />
    
    <!-- Chart Line -->
    <path d="M 20,150 L 60,110 L 100,130 L 140,70 L 180,90 L 220,40 L 250,60" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Glowing Data Points -->
    <circle cx="60" cy="110" r="4" fill="#38bdf8" />
    <circle cx="100" cy="130" r="4" fill="#38bdf8" />
    <circle cx="140" cy="70" r="4" fill="#38bdf8" />
    <circle cx="180" cy="90" r="4" fill="#38bdf8" />
    <circle cx="220" cy="40" r="6" fill="#818cf8" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="250" cy="60" r="4" fill="#38bdf8" />

    <!-- Mini Analytics Bars -->
    <rect x="30" y="140" width="8" height="20" rx="2" fill="#818cf8" opacity="0.7"/>
    <rect x="70" y="120" width="8" height="40" rx="2" fill="#818cf8" opacity="0.7"/>
    <rect x="110" y="135" width="8" height="25" rx="2" fill="#818cf8" opacity="0.7"/>
    <rect x="150" y="90" width="8" height="70" rx="2" fill="#38bdf8" opacity="0.9"/>
    <rect x="190" y="105" width="8" height="55" rx="2" fill="#818cf8" opacity="0.7"/>
    <rect x="230" y="70" width="8" height="90" rx="2" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Foreground Main Text & Content (Guaranteed Unobscured) -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="220" height="30" rx="15" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
      <text x="110" y="20" text-anchor="middle" class="badge-text">⚡ CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="155" class="title">Awesome-Analytics 📈</text>

    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle">Top Product &amp; Web Analytics Tools • SaaS &amp; Open-Source</text>

    <!-- Sub-badges text/pills -->
    <g transform="translate(0, 230)">
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">
        📊 Product Analytics  •  🔒 Privacy-First  •  🚀 Self-Hosted  •  ⭐ GitHub Stars
      </text>
    </g>
  </g>
</svg>
